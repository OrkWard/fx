name: CI

# Linux is the gate for every change. Behavior that can differ on macOS runs in
# .github/workflows/macos.yml only when a change needs it.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A manual dispatch gets its own group so it cannot cancel the push run on
  # main.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig_mode:
    name: Build & Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimize: ReleaseSafe
            test_timeout_seconds: 1500
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.0"
          cache-key: ci-unit-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Check compactor boundary
        run: ./scripts/check-compactor-boundary.sh

      - name: Test CI and release scripts
        run: python3 -m unittest scripts.tests.test_macos_signing scripts.tests.test_detect_macos_need -q

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test
        env:
          TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout_seconds }}
        run: |
          started_at=$SECONDS
          trap 'printf "Unit tests elapsed: %ss\n" "$((SECONDS - started_at))"' EXIT
          timeout "${TEST_TIMEOUT_SECONDS}s" zig build test -Doptimize=${{ matrix.optimize }}

      - name: Save Zig cache
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  zig:
    name: Build & Test
    if: ${{ always() }}
    needs: [zig_mode]
    runs-on: ubuntu-latest
    steps:
      - name: Require unit tests
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          printf '%s\n' "$RESULTS"
          jq -e 'length == 1 and all(.[]; . == "success")' <<<"$RESULTS"

  build:
    name: Build fx (ReleaseSafe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.0"
          cache-key: ci-build-ReleaseSafe

      # Other runners execute this binary, and their CPUs can differ from this
      # one. A native build can emit instructions such as AVX-512 that those
      # runners lack, so target the baseline CPU like the release builds do.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Smoke test fresh binary
        run: scripts/smoke-binary.sh zig-out/bin/fx

      - name: Save Zig cache
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  lint-scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck Fx scripts
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-compactor-boundary.sh
            scripts/check-public-surface.sh
            scripts/detect-macos-need.sh
            scripts/smoke-binary.sh
          )
          # bash -n parses only its first argument, so check each script.
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"

