name: macOS

# Linux CI covers everything that behaves the same on every platform. These
# checks run only for changes that can behave differently on macOS; see
# scripts/detect-macos-need.sh. Add the ci:macos label or dispatch this
# workflow to request them for any other change.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect macOS need
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
    steps:
      # A dispatch diffs the branch against main, so it runs at least the checks
      # its pull request run would.
      - uses: actions/checkout@v4
        with:
          # 0 is falsy in expressions, so the dispatch case must come last.
          fetch-depth: ${{ github.event_name != 'workflow_dispatch' && 2 || 0 }}

      - name: Decide whether this change needs macOS
        id: detect
        env:
          MACOS_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci:macos') && 'ci:macos label' || '') }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            base="$(git merge-base origin/main HEAD)"
            scripts/detect-macos-need.sh "$base" HEAD
          else
            # The pull request merge commit's first parent is the base branch.
            scripts/detect-macos-need.sh HEAD^1 HEAD
          fi

  unit:
    name: macOS arm64 unit tests
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
          use-cache: false

      - name: Test signing and release routing
        run: python3 -m unittest scripts.tests.test_macos_signing -q

      - name: Run unit tests
        run: zig build test -Doptimize=ReleaseSafe

  build:
    name: macOS arm64 build
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
          use-cache: false

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Smoke test fresh binary
        run: scripts/smoke-binary.sh zig-out/bin/fx

  macos:
    name: macOS arm64
    if: ${{ always() }}
    needs: [detect, unit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require macOS results when the change needs them
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          NEEDED: ${{ needs.detect.outputs.needed }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$DETECT_RESULT" = success
          if [ "$NEEDED" != true ]; then
            echo "No macOS-specific change; nothing to require."
            exit 0
          fi
          test "$UNIT_RESULT" = success
          test "$BUILD_RESULT" = success
